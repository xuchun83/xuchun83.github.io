# =============================================================================
# Site Settings
# =============================================================================
# This is a drop-in _config.yml for the acad-homepage.github.io template.
# Upload this file to the ROOT of your forked repository to replace the default one.
#
# Template repo: https://github.com/RayeRen/acad-homepage.github.io
# Deploy target: https://xuchun83.github.io/
# =============================================================================

locale                   : "en-US"
title                    : "Chun Xu"
title_separator          : "-"
name                     : &name "Chun Xu"
description              : &description "Chun Xu's academic homepage. Junior undergraduate at Central South University. Research in Computer Vision and Multimodal Large Language Models."
url                      : "https://xuchun83.github.io"
baseurl                  : ""
repository               : "xuchun83/xuchun83.github.io"
words_per_minute         : 200
future                   : true
read_more                : "disabled"
talkmap_link             : false


# -----------------------------------------------------------------------------
# Site Author (controls the LEFT SIDEBAR)
# -----------------------------------------------------------------------------
author:
  name             : "Chun Xu"
  avatar           : "profile.png"
  bio              : "Junior Undergraduate <br/>Central South University"
  location         : "Changsha / Hefei, China"
  employer         :
  pubmed           :
  googlescholar    :
  email            : "xc_anhui0@163.com"
  wechat           :
  researchgate     :
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : "xuchun83"
  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  linkedin         :
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :


# -----------------------------------------------------------------------------
# Reading Files / Build
# -----------------------------------------------------------------------------
include:
  - .htaccess
  - _pages
  - files
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# -----------------------------------------------------------------------------
# Conversion / Markdown
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# -----------------------------------------------------------------------------
# Markdown Processing (kramdown)
# -----------------------------------------------------------------------------
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# -----------------------------------------------------------------------------
# Sass / SCSS
# -----------------------------------------------------------------------------
sass:
  sass_dir: _sass
  style: compressed


# -----------------------------------------------------------------------------
# Outputting
# -----------------------------------------------------------------------------
permalink: /:categories/:title/
timezone: Asia/Shanghai


# -----------------------------------------------------------------------------
# Plugins (compatible with GitHub Pages)
# -----------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji


# -----------------------------------------------------------------------------
# Archives
# -----------------------------------------------------------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# -----------------------------------------------------------------------------
# HTML Compression
# -----------------------------------------------------------------------------
compress_html:
  clippings: all
  ignore:
    envs: development


# -----------------------------------------------------------------------------
# Defaults (page front matter)
# -----------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
